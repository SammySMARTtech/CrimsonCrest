<style>
/* Layout: one pixel-scaled 480x270 canvas centered on black, touch pads pinned to the bottom corners */
:root{--bg:#07080d;--ink:#e8e2d6;--crimson:#c0283f;--btn:rgba(232,226,214,.10);--line:rgba(232,226,214,.25);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;place-items:center}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;outline:none}
#touch{--padx:max(16px,7vw);--pady:max(14px,5vh)}#touch.edge{--padx:12px;--pady:12px}
.pad{position:fixed;bottom:calc(var(--pady) + env(safe-area-inset-bottom,0px));display:grid;gap:6px;opacity:.85}
.pad.l{left:calc(var(--padx) + env(safe-area-inset-left,0px));grid-template-columns:repeat(2,68px);grid-template-rows:repeat(3,42px);column-gap:0}
/* left and right touch in the middle, so a thumb can rock between them */
.pad.l [data-k=left]{border-radius:10px 0 0 10px;border-right-width:.5px}.pad.l [data-k=right]{border-radius:0 10px 10px 0;border-left-width:.5px}
.pad.l [data-k=up],.pad.l [data-k=down]{grid-column:1/3;justify-self:center;width:50px}
.pad.r{right:calc(var(--padx) + env(safe-area-inset-right,0px));grid-template-columns:repeat(2,62px);grid-template-rows:repeat(2,50px) 34px 30px}
.pad button{font:10px Silkscreen,monospace;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;touch-action:none;padding:0}
.pad.sys{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;right:calc(12px + env(safe-area-inset-right,0px));grid-template-columns:repeat(3,48px);grid-template-rows:28px}
.pad button.on{background:var(--crimson)}
/* no double-tap zoom, magnifier or tap flash on iPad */
html,body,canvas,.pad,.pad button{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none}
</style>
<div id="game"><canvas id="c" tabindex="0" aria-label="Crimson Crest game"></canvas></div>
<div id="touch" hidden>
  <div class="pad sys"><button data-k="gear">MAP</button><button data-k="pause">PAUSE</button><button data-k="mute">MUTE</button></div>
  <div class="pad l">
    <button data-k="up" style="grid-row:1">UP</button>
    <button data-k="left" style="grid-area:2/1">◀</button>
    <button data-k="right" style="grid-area:2/2">▶</button>
    <button data-k="down" style="grid-row:3">DN</button>
  </div>
  <div class="pad r">
    <button data-k="heal">HEAL</button><button data-k="dash">DASH</button>
    <button data-k="attack">ATK</button><button data-k="jump">JUMP</button>
    <button data-k="swap">SWAP</button><button data-k="art">ART</button>
    <button data-k="drink">DRINK</button><button data-k="ride">RIDE</button>
  </div>
</div>
<script>
/* CHANGELOG
 * v8  Phase 1 fixes:
 *     - inputs pressed during hitstop are kept and fire right after it (pause/mute are consumed once)
 *     - enemy mix per realm is seeded like the terrain, so it is the same on every death and reload
 *     - the game loop waits for the Silkscreen font (1.5 s fallback) so text never draws in a fallback face
 *     - touch PAUSE and MUTE buttons
 *     - progress is also saved when the page is hidden or closed; play time is now saved
 *     - island rosaries remember being collected (no more farming them by dying)
 *     - weapon swap is blocked mid-swing
 *     - weapon pose, lean and swing trail ease by time in update(), not per drawn frame
 *     - updPlayer split into small functions; movement numbers are named constants
 * v9  GUI: title menu (continue / new game / settings), difficulty select, settings screen
 *     (difficulty, volume, screen shake, touch buttons; saved under 'crimson-crest-settings'), pause menu
 * v10 Graphics: outlined pixel-art enemy models (bosses rendered at native res then scaled),
 *     depth-shaded terrain with per-realm props, fog bands, vertical parallax, dynamic lighting in dark realms
 * v11 The Hollow Beneath:
 *     - the realms become one hand-laid, maze-like map of 27 rooms (doors left/right/up/down, loops, gated routes)
 *       built around the story "The Hollow Beneath"; room interiors are seeded and checked for reachability
 *     - voiced cutscenes (speech synthesis, blips as fallback) for the prologue, discoveries and endings
 *     - NPCs with shops: Tobb (draughts, oil, sigils, slots), the Smith (weapon tiers that change their look),
 *       Ysolde (sigils and arts); equippable sigils, potions (R), Silk Needle (V), Crimson Arc (hold attack)
 *     - the Listener (hunts by sound; feed it a blind fish for peace), lantern oil, breath underwater
 *     - realm mechanics: pools and flooded stairs, icy footing, collapsing planks, cobwebs you can cut
 *     - fairer bosses: "!" before every attack, landing and impact markers, a pause after they hit you;
 *       Bog Mother, the Silk Queen and Rimefang give sigils instead of weapons; Vargrax guards the Ember Heart
 *     - procedural music per region, map and gear screen (I), drop through platforms (down + jump)
 * v13 New areas, weapons, guide book, graphics:
 *     - THE INKWELL ARCHIVE (east of the Mire Throne) and THE BRASS FOUNDRY (east of Kings' Landing): 8 rooms,
 *       6 new enemies, 2 new guardians (the Ink Warden, the Brass Colossus), music and opening scenes
 *     - 5 weapons with abilities: Ember Brand (burn), Rime Axe (freeze), Storm Glaive (chain lightning),
 *       Leech Fang (heals), Bone Bow (piercing arrows); three rest on shrines, two are guardian rewards
 *     - the Wanderer's Almanac: sold by Tobb, read on the map screen; 80 entries with found / not found checks
 *     - graphics: coloured bloom, light shafts, a hazy far layer, foreground silhouettes, deeper water with
 *       caustics, contact shadows, the knight's lantern, rising souls, colour grading per region
 * v14 Touch buttons sit further in from the edges and are bigger (BUTTON SPOT in settings puts them back);
 *     an optional TUTORIAL on the title screen: a training field with ten lessons that never touches your save
 * v15 The Listener: cuter design, a boss fight in its nest that is all about sound, the Hushblade as its gift, and a
 *     friend to pet afterwards; weapons change design when Honed and Runed; the map is dug up with the spike and a
 *     mini map sits in the corner; the Listener's Burrow and the Pipeworks shortcuts; balance pass on weapons;
 *     controller support, pause on leaving the app, a save crest, visible sound ripples, guardian banners
 * v16 New creatures: the Sunken Sea, the Stormwell and the Overgrowth with 7 new foes and 6 new guardians
 *     (lightning and tidal-wave attacks, 6 new sigils); 3 beasts to tame and ride (B / RIDE), which take a hit for you;
 *     4 new heroes to play as (Eclipse King, Lava Warrior, Ice Star, Silver Leaf), each with its own look and perks
 * v17 Joints: the knight is a puppet now, with hips, knees, shoulders, elbows and a waist; feet plant on the ground,
 *     the sword arm reaches out with every swing, the cape trails on links. Every walking creature steps on two-bone
 *     legs (insects in a tripod gait, cats in a gallop), wings have a wrist that lags the shoulder, tentacles curl in
 *     three joints, the Listener's paws step, Vargrax's legs and wings bend, and Tobb, the Smith and Ysolde have arms
 * v12 Voices: ranks the device's voices (neural / natural first), near-natural pitch, sentence-by-sentence
 *     pacing with pauses, music ducks under speech, NARRATOR setting to pick the voice
 */
'use strict';
const W=480,H=270,T=16;
// ctx is swapped to an offscreen canvas while sprites are drawn (see drawOutlined)
const cv=document.getElementById('c'),MAIN_CTX=cv.getContext('2d');let ctx=MAIN_CTX,RES=2;cv.width=W*RES;cv.height=H*RES;ctx.imageSmoothingEnabled=false;
// the world is always 480x270; SHARP PIXELS draws it on a canvas twice as big, so light, text, curves and weapons get finer detail
function applyRes(){RES=settings.hires===false?1:2;if(cv.width!==W*RES){cv.width=W*RES;cv.height=H*RES}MAIN_CTX.imageSmoothingEnabled=false}
const box=document.getElementById('game');
function fit(){const s=Math.min(box.clientWidth/W,box.clientHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0}
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16),t=f<0?0:255,a=Math.abs(f);const m=c=>Math.round(c+(t-c)*a);return`rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`}
const RGBC={};
function hexRGB(c){if(RGBC[c])return RGBC[c];let r='255,255,255';
  if(c&&c[0]==='#'){let s=c.slice(1);if(s.length===3)s=s.split('').map(x=>x+x).join('');const n=parseInt(s.slice(0,6),16);r=`${n>>16},${n>>8&255},${n&255}`}
  else if(c){const m=c.match(/[\d.]+/g);if(m)r=m.slice(0,3).join(',')}
  return RGBC[c]=r}
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),m=s=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t);return'#'+((1<<24)|(m(16)<<16)|(m(8)<<8)|m(0)).toString(16).slice(1)}
const GLOW_CACHE={};
function glowSprite(rgb){let c=GLOW_CACHE[rgb];if(c)return c;c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,`rgba(${rgb},1)`);g.addColorStop(.22,`rgba(${rgb},.5)`);g.addColorStop(.55,`rgba(${rgb},.14)`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(0,0,64,64);return GLOW_CACHE[rgb]=c}
function addGlow(x,y,r,rgb,a){if(a<=0||r<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(glowSprite(rgb),x-r,y-r,r*2,r*2)}
const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
const tri=(a,b,c,d,e,f)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.fill()};
function text(s,x,y,size=8,col='#e8e2d6',align='left'){ctx.font=`${size}px Silkscreen, monospace`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='#0b0d16';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col;ctx.fillText(s,x,y)}

/* ---------- audio ---------- */
let AC=null,MASTER=null,muted=false;
function initAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.connect(AC.destination);MUSIC=AC.createGain();MUSIC.connect(MASTER);applyVolume()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume()}
function applyVolume(){if(MASTER)MASTER.gain.value=muted?0:settings.volume/10;if(MUSIC)MUSIC.gain.value=settings.music/10*.8}
let NOISE=null;
function noise(dur,f0,f1,vol,type='bandpass',q=1.2){if(!AC||muted)return;

  if(c==='eclipse'){const x=dx+9,y=dy-3;ctx.fillStyle='#0b0d16';ctx.beginPath();ctx.arc(x,y,3.3,0,7);ctx.fill();ctx.strokeStyle=Math.sin(time*3)>0?'#ffd870':'#ffb030';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.stroke();if(world)glowProps.push([x,y,18,'255,200,90'])}
  else if(c==='lava'){if(world&&Math.random()<.25)parts.push({x:dx+5+Math.random()*9,y:dy+10+Math.random()*6,vx:(Math.random()-.5)*10,vy:-30-Math.random()*20,life:.5,max:.5,col:Math.random()<.5?'#ffb040':'#ff5020',size:1,glow:true});
    ctx.fillStyle='#ff8030';ctx.fillRect(dx+(f>0?5:12),dy+13,1,1)}
  else if(c==='ice'){if(Math.sin(time*4)>-.2){const x=dx+(f>0?13:4),y=dy+1;ctx.fillStyle='#ffffff';ctx.fillRect(x,y-2,1,5);ctx.fillRect(x-2,y,5,1)}}
  else if(c==='leaf'){const x=dx+9,y=dy+1;ctx.fillStyle='#ececf4';ctx.beginPath();ctx.ellipse(x,y-2,1.7,3.6,f*.5,0,7);ctx.fill();ctx.fillStyle='#ff9ab8';ctx.fillRect(x-.5,y-3,1,3)}}

 ['watch','hall',-1],['den','watch',-1],['den','dendepth',0],['dendepth','shelf',0],['queen','shelf',2],['shelf','embershaft',-1],
 ['embershaft','wyrm',-1],['chimney','landing',4],['throat','chimney',4],['hall','throat',5],['throat','rime',1],
 ['bog','archive',4],['archive','lshaft',4],['reading','lshaft',2],['lshaft','scriptorium',2],

function hashStr(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function doorsOf(id){
  const R=ROOMS[id],out=[];
  for(const[a,b,c]of LINKS){
    if(a!==id&&b!==id)continue;
    const sideLink=ROOMS[a].x+ROOMS[a].w===ROOMS[b].x;
    const side=sideLink?(a===id?'R':'L'):(a===id?'D':'U');
    out.push({side,k:sideLink?c-R.y:c-R.x,to:a===id?b:a,eye:(a==='stair'||b==='stair')})}
  return out}
const doorRow=d=>d.k*CELL_H+FLOOR_ROW;// floor row under a side door
const doorCol=d=>d.k*CELL_W+13;// first of the three columns of a vertical door

function buildRoom(id,rnd,plain){
  const R=ROOMS[id],reg=REGIONS[R.reg],w=R.w*CELL_W,h=R.h*CELL_H,g=new Uint8Array(w*h);
  const doors=doorsOf(id),flat=plain||R.guard!==undefined,step=R.gate?5:3;
  const set=(x,y,v)=>{if(x>=0&&x<w&&y>=0&&y<h)g[y*w+x]=v};
  const isl=new Set(),inv=new Set(),invSp=new Set(),ladder=new Set(),carved=new Set(),spots=[],spawns=[],loot=[],ground=[];
  const island=(x0,y,n)=>{for(let k=0;k<n;k++){set(x0+k,y,1);isl.add(y*w+x0+k)}};
  const invIsland=(x0,y,n)=>{for(let k=0;k<n;k++){set(x0+k,y,1);inv.add(y*w+x0+k);set(x0+k,y-1,3);invSp.add((y-1)*w+x0+k)}};
  // 1. terrain, one horizontal band (one cell tall) at a time
  for(let b=0;b<R.h;b++){
    const t0=b*CELL_H,bot=b===R.h-1?h:t0+CELL_H,last=b===R.h-1,gnd=new Array(w).fill(t0+FLOOR_ROW);ground.push(gnd);
    let x=0,gy=t0+FLOOR_ROW;
    const col=(cx,top)=>{for(let y=top;y<bot;y++)set(cx,y,1);gnd[cx]=top};
    const pit=cx=>{gnd[cx]=bot;// open column: spikes or a pool at the very bottom, a drop into the band below otherwise
      if(!last)return;
      if(reg.pools){for(let y=gy;y<h-1;y++)set(cx,y,5);set(cx,h-1,1);gnd[cx]=gy}
      else{set(cx,h-2,3);set(cx,h-1,3)}};
    const run=n=>{for(let k=0;k<n&&x<w;k++)col(x++,gy)};
    run(6);
    const end=w-7;
    while(x<end&&!flat){
      const r=rnd(),room=end-x;
      if(r<.3){const n=Math.min(room,4+(rnd()*5|0));
        spots.push({x:x+(n>>1),y:gy,b,n});if(n>=5)spawns.push({x:x+(n>>1),y:gy,air:false});
        if(n>=6&&gy-t0>=10&&rnd()<.45){const iy=gy-5;island(x+1,iy,3+(rnd()*2|0));loot.push({x:(x+2)*T+8,y:iy*T-6})}
        else if(n>=6&&gy-t0>=10&&rnd()<.35)invIsland(x+2,gy-6,3);
        run(n)}
      else if(r<.42&&room>=12){const n=8+(rnd()*3|0),x0=x;for(let k=0;k<n;k++)pit(x++);
        island(x0+2,gy-2-(rnd()*2|0),3);island(x0+n-5,gy-3-(rnd()*2|0),3);spawns.push({x:x0+(n>>1),y:gy-3,air:true});run(2)}
      else if(r<.56){gy=clamp(gy+(rnd()*5|0)-2,t0+FLOOR_ROW-3,t0+FLOOR_ROW+1);run(Math.min(room,3+(rnd()*3|0)))}
      else if(r<.72&&room>=6){const n=2+(rnd()*3|0);for(let k=0;k<n;k++)pit(x++);run(2)}
      else if(r<.86&&room>=11){const n=7+(rnd()*2|0),px=x+(n>>1)-1,py=gy-3;for(let k=0;k<n;k++)pit(x++);for(let k=0;k<3;k++)set(px+k,py,2);spawns.push({x:px+1,y:py,air:true});run(2)}
      else if(room>=5){const ph=2+(rnd()*2|0);run(1);col(x++,gy-ph);col(x++,gy-ph);run(2)}
      else run(1)}
    gy=t0+FLOOR_ROW;while(x<w)col(x++,gy);
    if(flat)for(const f of[.3,.5,.7])spots.push({x:Math.round(w*f),y:gy,b,n:6})}
  // 2. walls and a rough ceiling
  for(let y=0;y<h;y++){set(0,y,1);set(w-1,y,1)}
  for(let x=0;x<w;x++){set(x,0,1);if(reg.ceiling&&!flat){const n=rnd()*3|0;for(let y=1;y<=n&&y<3;y++)set(x,y,1)}}
  const levelGround=(b,x0,x1)=>{const t0=b*CELL_H,bot=b===R.h-1?h:t0+CELL_H,gy=t0+FLOOR_ROW;
    for(let x=Math.max(1,x0);x<=Math.min(w-2,x1);x++){for(let y=t0+3;y<bot;y++)set(x,y,y>=gy?1:0);ground[b][x]=gy}};
  // a column of one-way platforms from floor row `base` up to row `top` (both exclusive of solid rock)
  const ladderAt=(c0,base,top,wet)=>{
    for(let cx=c0;cx<c0+3;cx++){carved.add(cx);for(let y=top;y<base;y++){set(cx,y,wet?5:0);ladder.delete(y*w+cx)}}
    if(wet)return;
    for(let y=base-step;y>top;y-=step)for(let cx=c0;cx<c0+3;cx++){set(cx,y,2);ladder.add(y*w+cx)}
    if(top>0)for(let cx=c0;cx<c0+3;cx++){set(cx,top,2);ladder.add(top*w+cx)}};
  // 3. doors
  for(const d of doors){
    if(d.side==='L'||d.side==='R'){const fr=doorRow(d),x=d.side==='L'?0:w-1;levelGround(d.k,d.side==='L'?1:w-6,d.side==='L'?5:w-2);for(let y=fr-3;y<fr;y++)set(x,y,0)}
    else if(d.side==='U'){const c0=doorCol(d);levelGround(0,c0-2,c0+4);ladderAt(c0,FLOOR_ROW,0,R.water)}
    else{const c0=doorCol(d),b=R.h-1;levelGround(b,c0-2,c0+4);d.gy=ground[b][c0];for(let cx=c0;cx<c0+3;cx++){carved.add(cx);for(let y=d.gy;y<h;y++)set(cx,y,0)}}}
  // 4. ladders (or open water shafts) between stacked bands
  for(let b=0;b<R.h-1;b++){
    const below=ground[b+1],used=new Set(doors.filter(d=>d.side!=='L'&&d.side!=='R').map(doorCol));
    let c0=-1;
    for(let tries=0;tries<40&&c0<0;tries++){const c=4+(rnd()*(w-11)|0);if([...used].some(u=>Math.abs(u-c)<6))continue;
      if(below[c]===below[c+1]&&below[c]===below[c+2]&&below[c]<(b+2)*CELL_H)c0=c}
    if(c0<0){c0=w>=40?w-12:5;levelGround(b+1,c0-1,c0+3)}
    ladderAt(c0,ground[b+1][c0],ground[b][c0],R.water)}
  // 5. flooded rooms: everything below an air pocket at the top of each band is water
  if(R.water)for(let y=0;y<h;y++){if(y%CELL_H<3)continue;for(let x=1;x<w-1;x++)if(g[y*w+x]===0)g[y*w+x]=5}
  // 6. cobwebs
  if(reg.webs)for(let k=0;k<w/6;k++){const x=4+(rnd()*(w-8)|0),y=3+(rnd()*(h-8)|0);for(let dx=0;dx<2;dx++)for(let dy=0;dy<2;dy++)if(!g[(y+dy)*w+x+dx])set(x+dx,y+dy,4)}
  const keep=s=>s.x>7&&s.x<w-8&&!carved.has(s.x)&&!carved.has(s.x+1)&&!carved.has(s.x-1)&&g[s.y*w+s.x]===1&&g[(s.y-1)*w+s.x]===0;
  return{id,w,h,g,isl,inv,invSp,ladder,doors,ground,arena:R.guard!==undefined,spots:spots.filter(keep),spawns:spawns.filter(s=>s.x>8&&s.x<w-9&&!carved.has(s.x)),loot}}

/* ---------- reachability: can every door reach every other door, and can the player never get stuck? ---------- */
const ABIL={base:{up:4,dx:[5,5,4,4,3]},double:{up:7,dx:[6,6,6,5,5,5,4,4]}};
function roomOK(L,ab){
  const{w,h,g}=L,t=(x,y)=>g[clamp(y,0,h-1)*w+clamp(x,0,w-1)];
  const free=(x,y)=>{const v=t(x,y);return v!==1&&v!==3};
  const stand=(x,y)=>y>=2&&y<h&&(t(x,y)===1||t(x,y)===2)&&free(x,y-1)&&free(x,y-2);
  const swim=(x,y)=>y>=2&&y<h&&t(x,y-1)===5&&free(x,y-2)&&t(x,y)!==3;
  const node=(x,y)=>x>=1&&x<w-1&&(stand(x,y)||swim(x,y));
  const exits=L.doors.map(()=>new Set());
  const clear=(x,y,nx,ny)=>{const apex=Math.min(y,ny)-3;
    for(let r=y-1;r>=apex;r--)if(!free(x,r))return false;
    const s=Math.sign(nx-x);for(let c=x+s;c!==nx;c+=s)for(let r=apex;r<=apex+2;r++)if(!free(c,r))return false;
    for(let r=apex;r<ny;r++)if(!free(nx,r))return false;
    return true};
  const fall=(x,y,cb,from)=>{for(let r=y;;r++){
      if(r>=h){L.doors.forEach((d,i)=>{if(d.side==='D'&&x>=doorCol(d)&&x<doorCol(d)+3)exits[i].add(from)});return}
      const v=t(x,r);if(v===3)return;
      if(v===5){if(swim(x,r+1))cb(x,r+1);return}
      if(v===1||v===2){if(free(x,r-1)&&free(x,r-2))cb(x,r);return}}};
  const moves=(x,y,cb)=>{
    const key=y*w+x;
    L.doors.forEach((d,i)=>{
      if(d.side==='L'&&x<=1&&y===doorRow(d))exits[i].add(key);
      else if(d.side==='R'&&x>=w-2&&y===doorRow(d))exits[i].add(key);
      else if(d.side==='D'&&x>=doorCol(d)&&x<doorCol(d)+3&&y>=h-2&&swim(x,y))exits[i].add(key);// swimming out through the floor
      else if(d.side==='U'&&x>=doorCol(d)&&x<doorCol(d)+3&&y<=5){let ok=true;for(let r=0;r<y;r++)if(!free(x,r))ok=false;if(ok)exits[i].add(key)}});
    for(const s of[-1,1]){const nx=x+s;
      if(node(nx,y))cb(nx,y);else if(free(nx,y)&&free(nx,y-1)&&free(nx,y-2))fall(nx,y,cb,key)}
    if(swim(x,y)){if(node(x,y-1))cb(x,y-1);if(node(x,y+1))cb(x,y+1)}
    for(let dy=-ab.up;dy<=6;dy++){const lim=dy<0?ab.dx[-dy]:ab.dx[0]+1;
      for(let dx=-lim;dx<=lim;dx++){if(!dx&&dy>=0)continue;const nx=x+dx,ny=y+dy;if(node(nx,ny)&&clear(x,y,nx,ny))cb(nx,ny)}}
    if(t(x,y)===2)fall(x,y+1,cb,key)};// hold down + jump drops through a platform
  const entry=d=>{
    if(d.side==='L')return[1,doorRow(d)];if(d.side==='R')return[w-2,doorRow(d)];
    if(d.side==='U'){let e=null;fall(doorCol(d)+1,1,(x,y)=>e=[x,y],-1);return e}
    return node(doorCol(d)-1,d.gy)?[doorCol(d)-1,d.gy]:node(doorCol(d)+3,d.gy)?[doorCol(d)+3,d.gy]:null};
  const starts=L.doors.map(entry);
  if(!L.doors.length||starts.some(s=>!s||!node(s[0],s[1])))return false;
  // forward search from every entry, remembering edges so we can walk them backwards
  const adj=new Map(),seen=new Set(),q=[];
  for(const[x,y]of starts){const k=y*w+x;if(!seen.has(k)){seen.add(k);q.push(k)}}
  const fromEntry=starts.map(()=>null);
  for(let i=0;i<q.length;i++){const k=q[i],x=k%w,y=k/w|0,out=[];
    moves(x,y,(nx,ny)=>{const nk=ny*w+nx;out.push(nk);if(!seen.has(nk)){seen.add(nk);q.push(nk)}});adj.set(k,out)}
  // every door's exit must be reachable from every entry: check door 0 reaches all, all reach door 0
  const reach=start=>{const s=new Set([start]),qq=[start];for(let i=0;i<qq.length;i++)for(const n of adj.get(qq[i])||[])if(!s.has(n)){s.add(n);qq.push(n)}return s};
  const s0=reach(starts[0][1]*w+starts[0][0]);
  if(!exits.every(e=>[...e].some(k=>s0.has(k))))return false;
  for(let i=1;i<starts.length;i++){const si=reach(starts[i][1]*w+starts[i][0]);if(![...exits[0]].some(k=>si.has(k)))return false}
  // no softlocks: from anywhere you can stand, some exit must still be reachable
  const rev=new Map();for(const[k,out]of adj)for(const n of out){if(!rev.has(n))rev.set(n,[]);rev.get(n).push(k)}
  const good=new Set(),qq=[];for(const e of exits)for(const k of e)if(!good.has(k)){good.add(k);qq.push(k)}
  for(let i=0;i<qq.length;i++)for(const p of rev.get(qq[i])||[])if(!good.has(p)){good.add(p);qq.push(p)}
  for(const k of seen)if(!good.has(k))return false;
  return true}
function genRoom(id){
  const R=ROOMS[id],ab=R.req==='double'?ABIL.double:ABIL.base;
  let L=null;
  for(let a=0;a<50&&!L;a++){const c=buildRoom(id,rng(hashStr(id)+a*7919));if(roomOK(c,ab))L=c}
  if(!L){L=buildRoom(id,rng(hashStr(id)),true);L.plain=true}// flat floors and ladders: always passable
  // depth below the surface for terrain shading
  L.dep=new Uint8Array(L.w*L.h);
  for(let x=0;x<L.w;x++){let d=0;for(let y=0;y<L.h;y++){const v=L.g[y*L.w+x];d=v===1?d+1:0;L.dep[y*L.w+x]=d}}
  placeObjects(L);
  return L}

// story objects sit on flat spots found while generating the room
function placeObjects(L){
  const R=ROOMS[L.id],objs=[],used=[];
  const groundOk=(x,y)=>x>2&&x<L.w-3&&y>2&&y<L.h&&L.g[y*L.w+x]===1&&L.g[(y-1)*L.w+x]===0&&L.g[(y-2)*L.w+x]===0;
  const take=(f,band)=>{
    let best=null,bd=1e9;
    for(const s of L.spots){if(band!==undefined&&s.b!==band)continue;if(used.some(u=>Math.abs(u-s.x)<6))continue;const d=Math.abs(s.x-L.w*f);if(d<bd){bd=d;best=s}}
    for(let dx=0;!best&&dx<L.w;dx++)for(const sx of[Math.round(L.w*f)+dx,Math.round(L.w*f)-dx]){
      const b=band??R.h-1,y=L.ground[b][sx];if(!best&&groundOk(sx,y)&&!used.some(u=>Math.abs(u-sx)<5))best={x:sx,y,b}}
    used.push(best.x);return best};
  if(R.bench){const s=take(L.id==='landing'?.22:.3,R.h-1);objs.push({type:'bench',x:s.x-1,y:s.y});if(R.npc)objs.push({type:'npc',id:R.npc,x:s.x+3,y:s.y})}
  const f=R.feature;
  if(f==='dig'){const s=take(.62);objs.push({type:'dig',x:s.x,y:s.y})}
  if(f==='tally'){const s=take(.7);objs.push({type:'tally',x:s.x,y:s.y})}
  if(f==='whisper'){const s=take(.62);objs.push({type:'whisper',x:s.x,y:s.y})}
  if(f==='journal'){const s=take(.8,0);objs.push({type:'journal',x:s.x,y:s.y})}
  if(f==='stone1'||f==='stone2'||f==='stone3'){const s=take(f==='stone2'?.85:.55,R.h-1);objs.push({type:'stone',n:+f[5],x:s.x,y:s.y})}
  if(f==='exit'){const s=take(.5,0);objs.push({type:'exit',x:s.x,y:s.y})}
  if(R.relic){const s=take(.5);objs.push({type:'relic',w:R.relic,x:s.x,y:s.y})}
  if(R.beast){const s=take(.62);objs.push({type:'beast',m:R.beast,x:s.x,y:s.y})}
  if(L.id==='hall'){const d=L.doors.find(d=>d.eye);objs.push({type:'door',x:doorCol(d)+1,y:FLOOR_ROW})}
  if(R.reg==='fungal'&&!L.arena)for(let i=0;i<4&&L.spots.length>used.length;i++){const s=take(((i*.37+.15)%1));objs.push({type:i%2?'toxic':'cap',x:s.x,y:s.y})}
  if(REGIONS[R.reg].pools&&!R.water){// blind fish swim in the pools
    const surf=[];for(let x=3;x<L.w-3;x++){const y=L.ground[R.h-1][x];if(L.g[y*L.w+x]===5&&L.g[(y-1)*L.w+x]===0)surf.push({x,y})}
    for(let i=0;i<2&&surf.length;i++){const s=surf[(hashStr(L.id)>>>(i*5))%surf.length];objs.push({type:'fish',x:s.x,y:s.y+1})}}
  L.objs=objs}

/* ---------- moving between rooms ---------- */
const roomCache={};
let roomId='landing',lis=null;
const roomTemplate=id=>roomCache[id]||(roomCache[id]=genRoom(id));
// lowest solid row at or above `row` in column tx (-1 if open to the top)
function ceilAt(tx,row){for(let y=row;y>=0;y--)if(tileAt(tx,y)===1)return y;return -1}
// close (or reopen) a room's doorways: boss arenas while the guardian lives, the eye door until three stones are set
function sealDoors(on,only){
  for(const d of L.doors){if(only&&!only(d))continue;
    const cells=d.side==='L'||d.side==='R'?[0,1,2].map(i=>[d.side==='L'?0:L.w-1,doorRow(d)-3+i]):[0,1,2].map(i=>[doorCol(d)+i,d.side==='U'?0:L.h-1]);
    for(const[x,y]of cells){L.g[y*L.w+x]=on?1:0;if(on)L.gates.add(y*L.w+x);else L.gates.delete(y*L.w+x)}}}
function enterRoom(id,how={}){
  const tpl=roomTemplate(id),R=ROOMS[id],prevReg=BIO;
  roomId=id;BIO=REGIONS[R.reg];
  L=Object.assign({},tpl,{arenaX:0,arenaGy:FLOOR_ROW,g:tpl.g.slice(),gates:new Set(),crumbling:new Map(),regrow:[],bossDone:R.guard===undefined||!!beaten[id]||(id==='nest'&&!!flags.listenerSlain)});
  L.objs=tpl.objs.filter(o=>!(o.type==='stone'&&flags['stone'+o.n])&&!(o.type==='beast'&&mounts.includes(o.m))&&!(o.type==='relic'&&(owned.includes(o.w)||(o.w==='hush'&&!flags.listenerSlain)))).map(o=>Object.assign({},o,{t:0}));
  enemies=[];projs=[];coins=[];boss=null;lis=null;pShots=[];bossCard=0;
  parts=parts.filter(q=>!q.amb||prevReg===BIO);
  const spawnRng=rng(hashStr(id)*31+7);// seeded so a room always holds the same enemies
  for(const s of tpl.spawns){
    const skip=spawnRng()<.2,pick=spawnRng(),list=s.air?BIO.ak:BIO.gk;
    if(skip||!list.length)continue;
    if(L.objs.some(o=>(o.type==='bench'||o.type==='npc')&&Math.abs(o.x-s.x)<10))continue;
    const k=list[pick*list.length|0],K=KINDS[k];
    const y=K.ai==='drop'?(ceilAtTpl(tpl,s.x,s.y-1)+1)*T+8:s.air?s.y*T-64:s.y*T-K.h;
    enemies.push(makeEnemy(k,s.x*T,y))}
  const taken=lootTaken[id]||[];
  tpl.loot.forEach((c,i)=>{if(!taken.includes(i))coins.push({x:c.x,y:c.y,vx:0,vy:0,t:0,rest:true,lootId:i})});
  if(!flags.doorOpen)sealDoors(true,d=>d.eye);
  if(BIO.listener&&!flags.peace&&!flags.listenerSlain&&id!=='nest'&&id!=='burrow')spawnListener();
  if(flags.listenerFriend&&['nest','den','dendepth'].includes(id)){// your friend waits for you here
    const s=tpl.spots.length?tpl.spots[Math.floor(tpl.spots.length/2)]:{x:Math.floor(L.w/2),y:FLOOR_ROW};L.objs.push({type:'pal',x:s.x,y:s.y,t:0,hop:0})}
  Object.assign(P,{vx:how.vx??0,vy:how.vy??0,dashT:0,atkT:0,healT:0});
  if(how.door){
    const d=L.doors.find(d=>d.to===how.door);
    if(d.side==='L'||d.side==='R'){P.x=d.side==='L'?T+4:(L.w-1)*T-P.w-4;P.y=doorRow(d)*T-P.h;P.vy=0}
    else if(d.side==='U'){P.x=(doorCol(d)+1)*T+3;P.y=6;P.vy=Math.max(P.vy,60)}
    else{// rising out of a floor hole: launch high enough to clear it and drift onto the ledge
      P.x=(doorCol(d)+1)*T+3;P.y=L.h*T-P.h-2;P.vy=-Math.sqrt(2*GRAVITY_JUMP_CUT*(L.h-d.gy+2.6)*T);// jump isn't held, so the heavier jump-cut gravity applies
      P.vx=(doorCol(d)<L.w/2?1:-1)*135;P.wallLock=.32}}
  else{const b=(how.start&&L.objs.find(o=>o.type==='dig'))||L.objs.find(o=>o.type==='bench'&&(how.benchX===undefined||o.x===how.benchX))||{x:5,y:FLOOR_ROW};// a new game wakes beside the timber
    P.x=(b.x+(how.start?3:1))*T;P.y=b.y*T-P.h}
  P.safe={x:P.x,y:Math.min(P.y,(L.h-3)*T)};
  cam.x=clamp(P.x+P.w/2-W/2,0,L.w*T-W);cam.y=clamp(P.y-H*.55,0,L.h*T-H);
  fadeIn=.35;
  if(!explored.has(id)){explored.add(id);if(prevReg!==BIO||how.start)card=3.2}
  else if(prevReg!==BIO)card=2.4;
  music.want=BIO.key;
  onEnterRoom(id)}
function ceilAtTpl(tpl,tx,row){for(let y=row;y>=0;y--)if(tpl.g[y*tpl.w+tx]===1)return y;return -1}
// leaving through a doorway hands the knight to the neighbouring room, keeping momentum
function roomExit(p){
  const cx=p.x+p.w/2,inCols=d=>cx>=doorCol(d)*T-6&&cx<=(doorCol(d)+3)*T+6;
  let d=null;
  if(p.x<-2)d=L.doors.find(d=>d.side==='L'&&Math.abs(p.y+p.h-doorRow(d)*T)<4*T);
  else if(p.x+p.w>L.w*T+2)d=L.doors.find(d=>d.side==='R'&&Math.abs(p.y+p.h-doorRow(d)*T)<4*T);
  else if(p.y+p.h*.5<0)d=L.doors.find(d=>d.side==='U'&&inCols(d));
  else if(p.y>L.h*T)d=L.doors.find(d=>d.side==='D'&&inCols(d));
  if(!d)return false;
  enterRoom(d.to,{door:roomId,vx:p.vx,vy:p.vy});saveGame();return true}

function wrapInk(str,x,y,maxW,col,lh=11){ctx.font='8px Silkscreen, monospace';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle=col;let line='';

  if(line){ctx.fillText(line,x,y);y+=lh}return y}

  const ink8=(s,x,y,col=ink,al='left')=>{ctx.font='8px Silkscreen, monospace';ctx.textAlign=al;ctx.textBaseline='top';ctx.fillStyle=col;ctx.fillText(s,x,y)};

const PROMPT={beast:'TAME',pal:'PET',bench:'REST',npc:'TALK',dig:'DIG',tally:'EXAMINE',journal:'READ',door:'EXAMINE',whisper:'LISTEN'};
function nearObj(){
  let best=null,bd=24;
  for(const o of L.objs){if(!PROMPT[o.type])continue;
    const ox=o.x*T+(o.type==='bench'?12:8),dx=Math.abs(P.x+P.w/2-ox),dy=Math.abs(P.y+P.h-o.y*T);
    if(dy<20&&dx<bd){bd=dx;best=o}}
  return best}
function rest(o){if(tutorial)tutorial.rested=true;P.hp=P.maxHp;P.oil=P.maxOil;cp={room:roomId,x:o.x};say('YOU STRIKE FLINT AND STEEL. THE FIRE HOLDS.');
  sfx(440,.5,'triangle',220,.06);burst(o.x*T+12,o.y*T-6,'#ffb040',16,80,2,-60);saveGame()}
function interact(o){
  switch(o.type){
    case'bench':rest(o);break;
    case'npc':playScene(SCENES.npc(o.id),()=>{flags['met_'+o.id]=true;openShop(o.id)});break;

    case'tally':playScene('tally');break;
    case'journal':playScene('journal',()=>{items.journal=true;saveGame()});break;
    case'door':if(flags.doorOpen){say('THE WAY UP IS OPEN.');break}

      playScene('door',()=>{flags.doorOpen=true;sealDoors(false,d=>d.eye);saveGame()});break;

/* ---------- the Listener: eyeless, hunts by sound. Quiet down and it loses you; feed it and it lets you be ---------- */
let lastRipple=0;
function makeNoise(n){if(!BIO.listener)return;const m=(has('quietstep')?.5:1)*(P.wpn==='hush'?.25:1);din=Math.min(100,din+n*m);
  if(n*m>=4&&time-lastRipple>.15&&state==='play'){lastRipple=time;parts.push({x:P.x+P.w/2,y:P.y+P.h*.6,vx:0,vy:0,life:.45,max:.45,col:'#c8c0ff',ring:true,r0:4,r1:10+n*m*1.6})}}
function updNoise(p,dt){
  const still=Math.abs(p.vx)<12&&p.onGround&&p.atkT<=0;
  din=Math.max(0,din-dt*(still?30:9));
  if(p.sprint&&p.onGround)makeNoise(42*dt);
  else if(Math.abs(p.vx)>60&&p.onGround)makeNoise(9*dt)}
function spawnListener(){const hp=Math.round(160*DIFF().bossHp);
  lis={x:L.w*T*.62,y:(FLOOR_ROW-3)*T,w:34,h:22,vx:0,vy:0,state:'lurk',t:0,hp,max:hp,face:-1,hurt:0,tx:L.w*T*.35,ty:(FLOOR_ROW-2)*T,calm:0,lt:0}}
function updListener(dt){
  const l=lis;l.t+=dt;if(l.hurt>0)l.hurt-=dt;
  const pc=P.x+P.w/2,pcy=P.y+P.h/2,cx=l.x+l.w/2,cy=l.y+l.h/2;
  if(din>45||(l.state==='hunt'&&din>22)){l.tx=pc;l.ty=pcy;if(l.state!=='hunt')sfx(70,.6,'sawtooth',-30,.08);l.state='hunt';l.calm=0}
  if(l.state==='hunt'){l.calm+=din<15?dt:0;if(l.calm>2.2){l.state='listen';l.lt=0}}
  else if(l.state==='listen'){l.lt+=dt;if(l.lt>3){l.state='lurk';l.tx=T*4+Math.random()*(L.w-8)*T;l.ty=(2+Math.random()*(L.h-5))*T}}
  else if(Math.abs(l.tx-cx)<20){l.tx=T*4+Math.random()*(L.w-8)*T;l.ty=(2+Math.random()*(L.h-5))*T}
  const sp=l.state==='hunt'?(din>70?150:105):l.state==='lurk'?32:0,dx=l.tx-cx,dy=l.ty-cy,d=Math.hypot(dx,dy)||1;
  l.vx=approach(l.vx,dx/d*sp,320*dt);l.vy=approach(l.vy,dy/d*sp*.7,320*dt);
  l.x=clamp(l.x+l.vx*dt,T,(L.w-1)*T-l.w);l.y=clamp(l.y+l.vy*dt,2*T,(L.h-2)*T-l.h);
  if(Math.abs(l.vx)>6)l.face=Math.sign(l.vx);
  if(ov(l,P)){hurtPlayer(2,cx);l.state='hunt';l.tx=pc}}
function hitListener(dmg){const l=lis;l.hp-=Math.max(1,Math.ceil(dmg/2));l.hurt=.12;l.state='hunt';l.tx=P.x;l.ty=P.y;
  if(l.hp<=0){flags.listenerSlain=true;burst(l.x+l.w/2,l.y+l.h/2,'#dcd6ca',40,220,3);for(let i=0;i<40;i++)coins.push({x:l.x+l.w/2,y:l.y,vx:(Math.random()-.5)*300,vy:-100-Math.random()*200,t:0});
    lis=null;say('THE LISTENER FALLS SILENT. FOREVER.',4);saveGame()}}
/* ---------- the Listener's nest: a blind boss. It pounces at whatever it hears, so the fight is about being quiet ---------- */
function spawnListenerBoss(){const hp=Math.round(64*DIFF().bossHp),gy=L.arenaGy*T;din=0;
  boss={kind:'listener',name:'THE LISTENER',title:flags.peace?'IT WANTS TO PLAY':'IT HEARS EVERYTHING',x:P.x>L.w*T/2?5*T:(L.w-5)*T-56,y:gy-200,w:56,h:40,vx:0,vy:0,hp,max:hp,state:'enter',st:0,t:0,face:-1,hurt:0,alpha:1,heard:null,mood:'hunt'}}
function updListenerBoss(dt){
  const b=boss;b.t+=dt;b.st+=dt;if(b.hurt>0)b.hurt-=dt;if(b.calm>0)b.calm-=dt;
  const ax=(L.arenaX+1)*T,ar=(L.w-1)*T,gy=L.arenaGy*T,cx=b.x+b.w/2,rage=b.hp<=b.max/2,sp=DIFF().bossSpeed;
  const go=s=>{b.state=s;b.st=0;b.fired=false},faceTo=x=>{b.face=x>cx?1:-1};
  if(din>6||b.hurt>.08)b.heard=P.x+P.w/2;// one swing, a dash or a hard landing is enough// anything loud, or a hit, tells it where you are
  b.mood=['listen','sniff','dizzy','dying'].includes(b.state)?'calm':'hunt';
  const land=()=>{shake=6;sfx(90,.3,'square',-40,.08);dust(cx-14,b.y+b.h);dust(cx+14,b.y+b.h);for(const d of[-1,1])projs.push({x:cx+d*b.w/2,y:gy-6,vx:d*(rage?230:180),vy:0,r:5,life:1.8,col:'#d8ccff'})};
  switch(b.state){
    case'enter':if(b.onGround){land();go('listen')}break;
    case'listen':b.vx=approach(b.vx,0,900*dt);
      if(b.st>(rage?.5:.8)/sp&&b.heard!=null){b.mark=clamp(b.heard,ax+30,ar-30);b.heard=null;faceTo(b.mark);go(rage&&Math.random()<.45?'burrow':'pounce')}
      else if(b.st>2.4)go(Math.random()<.5?'howl':'sniff');break;
    case'sniff':if(b.st<dt*2)b.mark=ax+40+Math.random()*(ar-ax-80);// it cannot find you: it pads around, nose down
      faceTo(b.mark);b.vx=b.face*60*sp;if(Math.abs(b.mark-cx)<10||b.st>2.2||b.hitWall){b.vx=0;go('listen')}else if(b.heard!=null&&b.st>.3)go('listen');break;
    case'pounce':if(b.st<.55){b.vx=0;if(Math.random()<.3)dust(cx,b.y+b.h)}
      else if(!b.fired){b.fired=true;b.vy=-540;b.vx=clamp((b.mark-cx)/.9,-340,340)*sp;b.onGround=false;sfx(240,.25,'triangle',260,.06)}
      else if(b.hitWall&&!b.onGround){b.vx=0;b.bonk=true}
      else if(b.onGround&&b.st>.7){land();if(b.bonk){b.bonk=false;go('dizzy')}else go('listen')}break;
    case'howl':if(b.st<.6)b.vx=0;
      else if(!b.fired){b.fired=true;sfx(140,1,'sawtooth',90,.06);sfx(210,.9,'triangle',-60,.05);
        for(let i=0;i<3;i++)parts.push({x:cx+b.face*20,y:b.y+6,vx:0,vy:0,life:.5+i*.25,max:.5+i*.25,col:'#d8ccff',ring:true,r0:6,r1:60+i*30});
        for(const d of[-1,1])for(let k=0;k<(rage?2:1);k++)projs.push({x:cx,y:gy-6,vx:d*(160+k*90),vy:0,r:5,life:2.5,col:'#d8ccff'})}
      if(b.st>1.3)go('listen');break;
    case'burrow':// it dives under the floor and bursts up where it last heard you
      if(b.st<.4){b.vx=0;b.alpha=1-b.st/.4;if(Math.random()<.6)dust(cx,b.y+b.h)}
      else if(b.st<1.3){b.alpha=0;b.x+=(clamp(b.mark-b.w/2,ax,ar-b.w)-b.x)*Math.min(1,4*dt);if(Math.random()<.5)dust(b.x+b.w/2,gy)}
      else if(!b.fired){b.fired=true;b.alpha=1;b.vy=-620;b.onGround=false;shake=7;sfx(70,.5,'sawtooth',-30,.1);burst(b.x+b.w/2,gy,'#8a8090',20,180,2)}
      else if(b.onGround&&b.st>1.5){land();go('dizzy')}break;
    case'dizzy':b.vx=approach(b.vx,0,900*dt);if(b.st>1.2)go('listen');break;
    case'dying':b.vx=0;b.mood='calm';if(b.st>1.6){finishListenerFight();return}break}
  if(b.state!=='burrow'||b.st<.4||b.st>=1.3){b.vy+=1500*dt;moveBody(b,dt)}
  if(b.alpha>.5&&!['dizzy','dying'].includes(b.state)&&!(b.calm>0)&&ov(b,P))hurtPlayer(1,cx,false,true)}
function drawListenerBoss(){const b=boss,gy=L.arenaGy*T;
  if(b.state==='burrow'&&b.st>=.4&&b.st<1.3){ctx.fillStyle=`rgba(255,64,80,${.5+.3*Math.sin(time*16)})`;for(let i=-2;i<=2;i++)ctx.fillRect(b.mark+i*6-1,gy-2-(i&1)*2,3,2);return}// cracks where it will burst out
  ctx.save();ctx.globalAlpha=b.alpha;
  if(b.onGround){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(b.x+b.w/2,b.y+b.h+1,b.w/2,3,0,0,7);ctx.fill()}

  const wind={pounce:.55,howl:.6,burrow:.4}[b.state];if(wind&&b.st<wind)text('!',b.x+b.w/2,b.y-40+Math.sin(time*20)*1.5,16,'#ff4050','center');
  if(b.state==='pounce'&&b.mark!=null){ctx.fillStyle=`rgba(255,64,80,${.45+.3*Math.sin(time*14)})`;ctx.fillRect(b.mark-10,gy-2,20,2);ctx.fillRect(b.mark-1,gy-7,2,4)}
  if(b.state==='dizzy')for(let i=0;i<3;i++){const a=time*5+i*2.1;ctx.fillStyle='#ffe080';ctx.fillRect(b.x+b.w/2+14+Math.cos(a)*12,b.y-30+Math.sin(a)*4,3,3)}

function updShots(dt){
  for(const s of pShots){
    if(s.target){const t=s.target,alive=t===boss?!!boss&&boss.hp>0:t===lis?!!lis:!t.dead&&enemies.includes(t);
      if(!alive||s.hit.has(t))s.target=pickTarget(s.x,s.y,Math.sign(s.vx)||1,'side',s.hit);// through one foe and on to the next
      else{const cur=Math.atan2(s.vy,s.vx),da=clamp(((Math.atan2(t.y+t.h/2-s.y,t.x+t.w/2-s.x)-cur+Math.PI*3)%(Math.PI*2))-Math.PI,-14*dt,14*dt),sp=Math.hypot(s.vx,s.vy)||480;

const music={want:'title',cur:null,next:0,step:0};
let MUSIC=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function degree(tr,d,oct){const n=tr.sc.length;return tr.root+12*(oct+Math.floor(d/n))+tr.sc[((d%n)+n)%n]}
function tone(f,t,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g).connect(MUSIC);o.start(t);o.stop(t+dur+.05)}
function drum(t,kick){const o=AC.createOscillator(),g=AC.createGain();o.type=kick?'sine':'square';o.frequency.setValueAtTime(kick?120:6000,t);o.frequency.exponentialRampToValueAtTime(kick?40:3000,t+.08);
  g.gain.setValueAtTime(kick?.25:.015,t);g.gain.exponentialRampToValueAtTime(.0005,t+(kick?.18:.03));o.connect(g).connect(MUSIC);o.start(t);o.stop(t+.2)}
function updMusic(){
  if(!AC||!MUSIC)return;
  const want=boss&&boss.state!=='dying'?'boss':lis&&lis.state==='hunt'?'hunt':state==='title'?'title':music.want;
  if(want!==music.cur){music.cur=want;music.step=0;music.next=AC.currentTime+.1}
  const tr=TRACKS[music.cur];if(!tr)return;
  const sp=60/tr.bpm/4;
  if(music.next<AC.currentTime-.5)music.next=AC.currentTime+.05;// the tab was asleep: don't burst out every missed note
  while(music.next<AC.currentTime+.2){
    const s=music.step,t=music.next,b=tr.bass[s%tr.bass.length];
    if(b>=0)tone(mtof(degree(tr,b,0)),t,sp*3.5,'triangle',.16);
    if(s%2===0){const a=tr.arp[(s/2)%tr.arp.length];if(a>=0)tone(mtof(degree(tr,a,1)),t,sp*1.8,'square',.025)}
    if(s%32===0)for(const p of tr.pad)tone(mtof(degree(tr,p,1)),t,sp*30,'sine',.045);
    if(tr.drums){if(s%4===0)drum(t,true);if(s%2===1)drum(t,false)}
    music.step++;music.next+=sp}}

function voiceQuality(v){
  let q=0;
  if(/natural|neural/i.test(v.name))q+=100;
  if(/online/i.test(v.name))q+=50;
  if(/enhanced|premium|siri/i.test(v.name))q+=60;
  if(/google/i.test(v.name))q+=35;
  if(/espeak|compact|robot|novelty|bad news|bells|bubbles|cellos|whisper|zarvox|trinoids|albert|jester|organ|superstar|boing/i.test(v.name))q-=200;// novelty voices
  return q}
const rankedVoices=()=>[...voiceList].sort((a,b)=>voiceQuality(b)-voiceQuality(a));
function pickVoice(who){
  const v=VOICES[who];
  if(who==='narrator'&&settings.narrator){const chosen=voiceList.find(x=>x.name===settings.narrator);if(chosen)return chosen}
  const score=x=>voiceQuality(x)+(v.pref.test(x.name)?40:0)+(v.uk&&/GB|UK/i.test(x.lang+x.name)?8:0);
  const ranked=[...voiceList].sort((a,b)=>score(b)-score(a));
  if(who==='narrator'||!ranked.length)return ranked[0]||null;
  // everyone else avoids the narrator's voice (and the alt characters the main ones) if a comparable voice exists
  const taken=[pickVoice('narrator')];if(v.alt)taken.push(pickVoice(v.pref===MALE?'smith':'maren'));
  const other=ranked.find(x=>!taken.includes(x)&&v.pref.test(x.name));// never swap a man's voice for a woman's or back
  return other&&score(other)>score(ranked[0])-70?other:ranked[0]}
// split a line into sentences; an ellipsis earns a longer, held pause

  try{
    speechSynthesis.cancel();const token=++speechToken,parts=sentences(line),voice=pickVoice(who);
    speaking=true;duckMusic(true);
    const next=i=>{
      if(token!==speechToken)return;
      if(i>=parts.length){speaking=false;duckMusic(false);return}
      const u=new SpeechSynthesisUtterance(parts[i].replace(/\.\.\./g,'…'));
      try{if(voice)u.voice=voice}catch(e){}u.lang=voice?voice.lang:'en-GB';
      u.pitch=v.pitch;u.rate=v.rate*(parts[i].length<14?.92:1);// short, weighty sentences slow down a touch
      u.volume=clamp(settings.volume/10*(v.vol||1),0,1);

  startLine()}

function updScene(dt){

  if(pressed.pause){endScene();return}
  const before=Math.floor(s.shown);s.shown=Math.min(len,s.shown+dt*TYPE_SPEED);

/* ---------- the story, adapted from "The Hollow Beneath" ---------- */
const N='narrator';
const SCENES={

  {paint:PAINT.field,lines:[[N,'The map said the ruins of Kel Varran sat on solid granite.'],[N,'The map was wrong.']]},
  {paint:PAINT.crack,lines:[[N,'One moment you were crossing a field of wild thyme, three days from the nearest village. The next, the ground opened like a mouth.']]},
  {paint:PAINT.fall,lines:[[N,'You remember the crack of rotten timber, a long scrape of stone against your back, and then... nothing.']]},
  {paint:PAINT.wake,lines:[[N,'Now you wake to the sound of dripping water. Your lantern lies beside you, its glass cracked, its flame still stubbornly alive.'],[N,'Forty feet above, a ragged circle of grey sky. Far too high to climb. Your left ankle throbs.']]},
  {paint:PAINT.shift,lines:[[N,'Somewhere in the dark ahead, something shifts. Pebbles skitter across stone. Then silence.'],[N,'You are alone. Probably.']]}],
 dig:()=>[{paint:PAINT.dig,lines:[[N,'The timbers are old beams, cut by human hands long ago. You dig beneath them.'],[N,'Your fingers close on cold iron: a rusted spike. And a scrap of cloth, stitched with a sigil. A closed eye.'],[N,'You bind your ankle tight with the cloth. It holds. With the spike, you can bite into stone and climb.'],[N,'Wrapped around the spike is a map of the Hollow, sketched in charcoal by an unsteady hand. Someone was here before you.']]}],
 tally:()=>[{paint:PAINT.tally,lines:items.journal?[[N,"Maren's marks. She counted days down here."],[N,'She stopped at two hundred and eleven.']]:[[N,'Scratch marks cover the wall in groups of five. Hundreds of them.'],[N,'Someone was counting.']]}],

 hall:()=>[{paint:PAINT.hall,lines:[[N,'A vast chamber. Carved pillars rise into the dark, every one marked with the same sigil: a closed eye.'],[N,'Above the far stair, a sealed stone door. Three empty sockets, each shaped like an eye.']]}],
 journal:()=>[
  {paint:PAINT.skeleton,lines:[[N,'In a collapsed bedroll, a skeleton clutches a journal, far more intact than yours.']]},
  {paint:PAINT.journal,lines:[['maren','My name is Maren Thask. The ground gave way beneath me, as it must have for you.'],['maren','The door wants its three eye-stones back. I know where they hide. I never found the courage to take them.'],
   ['maren','One sleeps where the dark grows its own light.'],['maren','One waits where the dead fall but do not land.'],['maren',"One drowned with the old kings' stair."],
   ['maren','And beware the Listener. It cannot see. It does not need to. Keep quiet. Keep moving.'],['maren','Day two hundred and eleven. I am so tired. Down is out. I am sure of it now.']]}],
 stone1:()=>[{paint:PAINT.stone1,lines:[[N,'Tangled in the roots of the great fungal column, something glints.'],[N,'An eye-stone, warm as a living thing. One sleeps where the dark grows its own light.']]}],
 stone2:()=>[{paint:PAINT.stone2,lines:[[N,'In an alcove across the gap, among the bones of everything that ever fell, the second eye-stone waits.']]}],
 stone3:()=>[{paint:PAINT.stone3,lines:[[N,'At the bottom of the drowned stair, in a pocket of trapped air, the third eye-stone rests.'],[N,'Beside it, an old oilskin bag. Lamp oil, still sealed. Your lantern will burn longer now.']]}],
 listener:()=>[{paint:PAINT.listener,lines:[[N,'Something pale pads out of the dark. Round. Soft. Enormous ears. No eyes at all.'],[N,'It turns its head toward the sound of your breathing. It hunts by sound.'],[N,'Stay still. Stay silent. It may look soft, but it bites, and it never tires.']]}],
 peace:()=>[{paint:PAINT.feed,lines:[[N,'You set a blind fish down on the stone, and step back. Slowly.'],[N,"The Listener's head tilts. It takes the fish. For a long moment, it does not move."]]},
  {paint:PAINT.peace,lines:[[N,'Then it turns away. It will not hunt you again.']]}],
 door:()=>[{paint:PAINT.door,lines:[[N,'One by one, you press the eye-stones into their sockets. Each one opens.'],[N,'Stone grinds against stone. Beyond the door, a long stair climbs into the dark. Cold air flows up it.']]}],
 ending:()=>{const shots=[{paint:PAINT.stairs,lines:[[N,'You climb for what feels like hours. The stair ends at a crack in a hillside, hidden by roots.']]},
   {paint:PAINT.valley,lines:[[N,'You step out into a starlit valley. The air smells of thyme.']]}];
   if(items.journal)shots[1].lines.push([N,"Her story ends where yours begins. You'll make sure someone reads it."]);
   if(flags.listenerFriend)shots.push({paint:PAINT.peace,lines:[[N,'Your friend pads after you to the mouth of the cave, ears high.'],[N,'It will not come into the light. But it will be listening, if you ever come back.']]});
   else if(flags.peace)shots.push({paint:PAINT.peace,lines:[[N,'At the very edge of the light, something pale follows you to the mouth of the cave.'],[N,'Then it turns back into the dark. Home.']]});
   return shots},
 nest:()=>[{paint:PAINT.nest,lines:[[N,'A nest of soft moss and stolen cloth. In the middle, something pale is curled up asleep, its ears twitching.'],

   [N,'It noses something out from under the moss and pushes it toward you: a pale blade that makes no sound at all.'],[N,'You have a friend in the dark now.']]}],
 library:()=>[{paint:PAINT.library,lines:[[N,'Shelves taller than any tree climb into the dark. Every book is sealed with the same closed eye.'],[N,'Kel Varran wrote everything down. Something here still guards the last word.']]}],
 foundry:()=>[{paint:PAINT.foundry,lines:[[N,"Heat, and the slow grind of brass. The old king's machines are still turning, with no one left to tend them."],[N,'Somewhere below, something enormous turns with them.']]}],

/* ---------- state ---------- */
const SKEY='crimson-crest-v1';let saveFlash=0,stormT=3,flashT=0;
function loadSave(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return{}}}
function saveGame(){
  if(state!=='play'&&state!=='dead')return;
  if(tutorial)return;// the tutorial never touches your saved journey
  try{localStorage.setItem(SKEY,JSON.stringify({v:2,room:roomId,cp,explored:[...explored],flags,items,rosaries,owned,wpn:P.wpn,tiers,sigils,equipped,slots,arts,
    beaten,loot:lootTaken,deaths,playTime,oil:P.oil,maxOil:P.maxOil,mounts,cls:P.cls,lastMount:P.lastMount}));saveFlash=1.4}catch(e){}}
// a save from before the Hollow keeps its purse and weapons and wakes at the Landing
function migrateSave(s){return s.v===2?s:{rosaries:s.rosaries,owned:s.owned,wpn:s.wpn,playTime:s.playTime}}
// 6. rosaries picked up since the last bench/realm/boss save survive closing or reloading the tab
function saveIfPlaying(){if(state==='play'||state==='dead')saveGame()}
addEventListener('pagehide',saveIfPlaying);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveIfPlaying()});
let saved=loadSave();

const P={x:0,y:0,w:10,h:20,vx:0,vy:0,face:1,hp:5,maxHp:5,silk:0,onGround:false,coyote:0,jumpBuf:0,jumps:1,canDash:true,dashT:0,dashCD:0,atkT:0,atkCD:0,atkDir:'side',hitSet:new Set(),inv:0,healT:0,wallLock:0,anim:0,safe:{x:0,y:0},wpn:'greatsword',oil:100,maxOil:100,ironskin:0,charged:false,chargeT:0,drop:0};

function tileAt(tx,ty){return L.g[clamp(ty,0,L.h-1)*L.w+clamp(tx,0,L.w-1)]}// outside the room = the edge tile, so doorways continue outward
function boxType(b,t){const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-1)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-1)/T);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(tileAt(x,y)===t)return true;return false}
function moveBody(o,dt){
  o.x+=o.vx*dt;o.hitWall=0;
  let x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-1)/T),y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-1)/T);
  for(let ty=y0;ty<=y1;ty++){
    if(o.vx>0&&tileAt(x1,ty)===1){o.x=x1*T-o.w;o.vx=0;o.hitWall=1;break}
    if(o.vx<0&&tileAt(x0,ty)===1){o.x=(x0+1)*T;o.vx=0;o.hitWall=-1;break}}
  const pb=o.y+o.h;o.y+=o.vy*dt;o.onGround=false;
  x0=Math.floor(o.x/T);x1=Math.floor((o.x+o.w-1)/T);y0=Math.floor(o.y/T);y1=Math.floor((o.y+o.h-1)/T);
  // falling: test the row the feet are in (not one pixel above), so a body resting exactly on a platform stays on it
  const yf=Math.floor((o.y+o.h)/T);
  for(let tx=x0;tx<=x1;tx++){
    if(o.vy>0){const t=tileAt(tx,yf);if(t===1||(t===2&&pb<=yf*T+.01&&!(o.drop>0))){o.y=yf*T-o.h;o.vy=0;o.onGround=true;break}}
    else if(o.vy<0&&tileAt(tx,y0)===1){o.y=(y0+1)*T;o.vy=0;break}}
}
function wallTouch(p){const y0=Math.floor((p.y+4)/T),y1=Math.floor((p.y+p.h-4)/T);for(let y=y0;y<=y1;y++){if(tileAt(Math.floor((p.x-1)/T),y)===1)return-1;if(tileAt(Math.floor((p.x+p.w)/T),y)===1)return 1}return 0}
function solidUnder(p){const y=Math.floor((p.y+p.h+1)/T),a=tileAt(Math.floor((p.x+1)/T),y),b=tileAt(Math.floor((p.x+p.w-2)/T),y);return(a===1||a===2)&&(b===1||b===2)}

function makeEnemy(k,x,y){const K=KINDS[k];return{k,x,y,w:K.w,h:K.h,vx:0,vy:0,hp:Math.ceil(K.hp*DIFF().enemyHp),dir:-1,t:Math.random()*5,st:Math.random(),hurt:0,kbT:0,kb:0,state:K.ai==='drop'?'hang':'',home:y,dead:false}}
function say(s,t=2){msg=s;msgT=t}

function burst(x,y,col,n=8,sp=120,size=2,g=300){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.3+Math.random()*.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+Math.random()*.4,max:.7,col,size,g})}}
function impact(x,y,col,big,ang){if(ang!==undefined)parts.push({x,y,vx:0,vy:0,life:.16,max:.16,col,cut:true,ang,len:big?44:34});parts.push({x,y,vx:0,vy:0,life:.2,max:.2,col:'#ffffff',ring:true,r0:3,r1:big?30:18},{x,y,vx:0,vy:0,life:.09,max:.09,col:'#ffffff',flash:true,size:big?14:9});
  for(let i=0;i<(big?12:7);i++){const a=Math.random()*Math.PI*2,v=200+Math.random()*220;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.12+Math.random()*.14,max:.26,col:i%2?col:'#ffffff',streak:true})}}
function dust(x,y){for(let i=0;i<5;i++)parts.push({x:x+(Math.random()-.5)*8,y,vx:(Math.random()-.5)*60,vy:-Math.random()*30,life:.35,max:.35,col:'#9a948a',size:2,g:0})}
function updParts(dt){for(const q of parts){q.life-=dt;q.vy+=(q.g||0)*dt;
    if(q.kind==='firefly'||q.kind==='sparkle'){q.vx+=(Math.random()-.5)*60*dt;q.vy+=(Math.random()-.5)*60*dt;q.vx*=.98;q.vy*=.98}
    if(q.kind==='snow'||q.kind==='ash')q.vx=Math.sin(time+q.y*.05)*12;
    q.x+=q.vx*dt;q.y+=q.vy*dt}
  parts=parts.filter(q=>q.life>0)}
function ambient(){let n=0;for(const q of parts)if(q.amb)n++;const rain=BIO.amb==='rain';if(n>=(rain?90:34)||Math.random()>(rain?.97:.4))return;

function arrowTargets(){const t=enemies.filter(e=>!e.dead);if(boss&&boss.hp>0&&boss.state!=='enter'&&boss.state!=='dying'&&(boss.alpha??1)>.5)t.push(boss);if(lis)t.push(lis);return t}
function clearShot(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/6);for(let i=1;i<n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(tileAt(Math.floor(x/T),Math.floor(y/T))===1)return false}return true}
function pickTarget(x,y,face,dir,skip){let best=null,bs=1e9;

  pShots.push({x,y,vx,vy,life:1.1,dmg:W.dmg,kind:'arrow',pierce:true,hit:new Set(),big:p.charged,target:t});

/* ---------- player tuning: px, px/s, px/s², seconds ---------- */
const RUN_SPEED=140,SPRINT_SPEED=210,WEB_SLOW=.45;
const ACCEL_GROUND=2200,ACCEL_TURN=3200,DECEL_GROUND=2600,ACCEL_AIR=1400,AIR_OVERSPEED_DRAG=300;
const GRAVITY_RISE=1300,GRAVITY_FALL=1800,GRAVITY_JUMP_CUT=3000,GRAVITY_APEX=650,APEX_BAND=70;
const MAX_FALL=520,WEB_MAX_FALL=90,WALL_SLIDE_SPEED=70;
const JUMP_V=430,DOUBLE_JUMP_V=390,WALL_JUMP_VY=410,WALL_JUMP_VX=190,WALL_JUMP_LOCK=.12;
const DASH_SPEED=340,DASH_TIME=.15,DASH_COOLDOWN=.3;
const COYOTE_TIME=.12,JUMP_BUFFER=.14,HEAL_TIME=.65,HEAL_AMOUNT=2,SILK_MAX=9;// heal cost comes from the difficulty

function updPlayer(dt){
  const p=P;
  p.anim+=dt;
  p.run=(p.run||0)+dt*Math.abs(p.vx)/9;
  p.sq=approach(p.sq||0,0,dt*1.6);
  for(const k of['inv','atkCD','dashCD','wallLock','coyote','jumpBuf','drop','mountCD','ramGuard'])if(p[k]>0)p[k]-=dt;
  p.wet=tileAt(Math.floor((p.x+p.w/2)/T),Math.floor((p.y+p.h*.6)/T))===5;
  if(pressed.jump)p.jumpBuf=JUMP_BUFFER;
  const inWeb=boxType(p,4);
  let ax=(keys.right?1:0)-(keys.left?1:0);
  playerSwapAndRest(p);
  if(playerHeal(p,dt))ax=0;
  playerMove(p,dt,ax,inWeb);
  playerJump(p,ax);
  playerDash(p,ax);
  playerStartAttack(p,dt);
  const vyBefore=p.vy,wasGround=p.onGround;
  moveBody(p,dt);
  if(p.onGround){
    p.coyote=COYOTE_TIME;p.jumps=airJumps();p.canDash=true;
    if(!wasGround&&vyBefore>200){dust(p.x+p.w/2,p.y+p.h);p.sq=-.25;makeNoise(vyBefore>420?14:5)}}
  crumbleCheck(p);updNoise(p,dt);
  playerAttackUpdate(p,dt);
  playerHazards(p);
  playerTriggers(p);
  updPose(p,dt);
}
function playerSwapAndRest(p){
  // B. no swapping mid-swing: the hitbox and slash timing come from the current weapon
  if(pressed.swap&&owned.length>1&&p.atkT<=0){
    p.wpn=owned[(owned.indexOf(p.wpn)+1)%owned.length];say(WS().name,1.2);sfx(700,.08,'square',200,.04)}
  const o=nearObj();
  if(pressed.up&&p.onGround&&o){interact(o);return}
  if(pressed.up&&lis&&items.fish>0&&lis.state!=='hunt'&&Math.hypot(lis.x+lis.w/2-p.x,lis.y-p.y)<90){offerFish();return}
  if(pressed.drink&&drinkPotion('draught'))say('A RED DRAUGHT. WARMTH SPREADS THROUGH YOU.');
  if(pressed.art)throwNeedle();
  if(p.chargeT>.55&&Math.random()<.5)parts.push({x:p.x+Math.random()*p.w,y:p.y+Math.random()*p.h,vx:0,vy:-30,life:.3,max:.3,col:'#ff4060',size:1,glow:true})}
function playerHeal(p,dt){
  if(!(keys.heal&&p.onGround&&p.silk>=DIFF().heal&&p.hp<p.maxHp&&p.dashT<=0)){p.healT=0;return false}
  p.healT+=dt;
  if(Math.random()<.6)parts.push({x:p.x+p.w/2+(Math.random()-.5)*24,y:p.y+p.h,vx:0,vy:-60,life:.4,max:.4,col:'#ff5070',size:1,glow:true});
  if(p.healT>HEAL_TIME*(has('quickweave')||CLS().quickheal?.5:1)){
    p.hp=Math.min(p.maxHp,p.hp+HEAL_AMOUNT);p.silk-=DIFF().heal;p.healT=0;
    sfx(440,.4,'triangle',440,.07);burst(p.x+p.w/2,p.y+8,'#ff5070',16,120,2,0)}
  return true}
function playerMove(p,dt,ax,inWeb){
  if(!keys.dash||!ax||!flags.dug)p.sprint=false;// the twisted ankle: no sprinting until it is bound
  if(p.dashT>0){
    p.dashT-=dt;p.vx=p.face*DASH_SPEED;p.vy=0;
    parts.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:0,vy:0,life:.15,max:.15,col:'#8cc4f0',size:6,ghost:true});
    if(CLS().frostDash)for(const e of enemies)if(!e.dead&&!p.dashHits.has(e)&&ov(p,e)){p.dashHits.add(e);e.frozen=1.4;e.hp-=1;e.hurt=.12;burst(e.x+e.w/2,e.y+e.h/2,'#c8f4ff',8,90,1,0);if(e.hp<=0)killEnemy(e)}
    if(has('frostfang'))for(const e of enemies)if(!e.dead&&!p.dashHits.has(e)&&ov(p,e)){p.dashHits.add(e);e.hp-=2;e.hurt=.12;impact(e.x+e.w/2,e.y+e.h/2,'#a0e0ff');if(e.hp<=0)killEnemy(e)}
    if(p.dashT<=0&&keys.dash&&ax&&flags.dug)p.sprint=true;
    return}
  if(p.wallLock<=0){
    const slowed=p.wet&&!has('bogheart'),top=(p.sprint?SPRINT_SPEED:RUN_SPEED)*(inWeb?WEB_SLOW:1)*(slowed?.55:1)*(has('swiftsole')?1.12:1)*(CLS().speed||1)*(p.ride?MOUNTS[p.ride].speed:1);
    const turning=ax&&Math.sign(ax)!==Math.sign(p.vx);
    // in the air, speed above the cap (from a dash or sprint) bleeds off slowly so momentum carries
    const overspeed=ax===Math.sign(p.vx)&&Math.abs(p.vx)>top;
    const acc=p.onGround?(ax?(turning?ACCEL_TURN:ACCEL_GROUND):DECEL_GROUND):(overspeed?AIR_OVERSPEED_DRAG:ACCEL_AIR);
    const grip=BIO.icy&&p.onGround?(ax?.45:.16):1;// frozen stone: slow to start, slower to stop
    p.vx=approach(p.vx,ax*top,acc*grip*dt);
    if(ax&&p.atkT<=0)p.face=ax;
    if(p.sprint&&p.onGround&&Math.random()<.3)dust(p.x+p.w/2,p.y+p.h)}
  const apexHang=keys.jump&&Math.abs(p.vy)<APEX_BAND;// hang time at the apex while jump is held
  const g=apexHang?GRAVITY_APEX:p.vy<0?(keys.jump?GRAVITY_RISE:GRAVITY_JUMP_CUT):GRAVITY_FALL;
  p.vy+=(p.wet?380:g)*dt;
  if(!p.onGround&&p.vy>0){
    const ws=wallTouch(p);
    if(ws&&ax===ws&&flags.dug){p.vy=Math.min(p.vy,WALL_SLIDE_SPEED);p.face=ws;if(Math.random()<.15)dust(p.x+(ws>0?p.w:0),p.y+6)}}
  if(has('silkwings')&&keys.jump&&!p.onGround&&p.jumps<=0&&p.vy>55)p.vy=55;// glide
  if(p.ride&&MOUNTS[p.ride].glide&&keys.jump&&!p.onGround&&p.vy>70)p.vy=70;// the roc spreads its wings
  p.vy=Math.min(p.vy,inWeb?WEB_MAX_FALL:p.wet?110:MAX_FALL)}
function playerJump(p,ax){
  if(p.jumpBuf<=0||p.healT>0)return;
  if(keys.down&&p.onGround&&tileAt(Math.floor((p.x+p.w/2)/T),Math.floor((p.y+p.h+1)/T))===2){p.drop=.25;p.jumpBuf=0;p.y+=2;return}// drop through
  if(p.wet){p.jumpBuf=0;p.vy=p.headWet?-220:-JUMP_V*.85;sfx(300,.06,'sine',200,.04);burst(p.x+p.w/2,p.y,'#a0d8ff',4,40,1,0);return}// swim stroke

    p.vy=-JUMP_V*(p.ride?MOUNTS[p.ride].jump:1);p.coyote=0;jumped();sfx(300,.08,'square',200,.04);dust(p.x+p.w/2,p.y+p.h)}

    sfx(340,.08,'square',200,.04);dust(p.x+(ws>0?p.w:0),p.y+10)}
  else if(p.jumps>0){
    p.vy=-DOUBLE_JUMP_V;p.jumps--;jumped();sfx(500,.1,'triangle',300,.05);burst(p.x+p.w/2,p.y+p.h,'#c0283f',8,80,1,0)}}
function playerDash(p,ax){

  p.dashT=DASH_TIME;p.dashCD=DASH_COOLDOWN*(has('chimerahorn')?.5:1);p.dashHits=new Set();makeNoise(16);

function playerStartAttack(p,dt){

    else if(!keys.attack){const ready=p.chargeT>.55;p.chargeT=0;if(ready){beginSwing(p,true);return}}}

function beginSwing(p,charged){

  makeNoise(charged?14:7);

  if(p.atkDir==='side'){if(p.onGround)p.vx+=p.face*(W.heavy?60:110);kick.x+=p.face*1.5}
  else kick.y+=p.atkDir==='up'?-1.5:1.5}
function playerAttackUpdate(p,dt){
  if(p.atkT<=0){p.charged=false;return}
  if(WS().ranged){p.atkT-=dt;return}
  swingSparks(p);
  p.atkT-=dt;
  const b=atkBox(p);
  for(const e of enemies)if(!e.dead&&!p.hitSet.has(e)&&ov(b,e)){p.hitSet.add(e);hitEnemy(e)}

  const ax=(L.arenaX+1)*T,ar=(L.w-1)*T,gy=L.arenaGy*T,oy=gy-12*T,rage=b.hp<=b.max/2,pc=P.x+P.w/2,cx=b.x+b.w/2;
  const mv=(tx,ty,k)=>{b.x+=(tx-b.x)*Math.min(1,k*dt);b.y+=(ty-b.y)*Math.min(1,k*dt)};
  const go=s=>{b.state=s;b.st=0;b.shots=0};
  switch(b.state){
    case'enter':mv(ar-150,oy+40,1.5);b.face=-1;if(b.st>2.2)go('hover');break;
    case'hover':{const side=cx>pc?1:-1;mv(clamp(pc+side*110-b.w/2,ax,ar-b.w),oy+36+Math.sin(b.t*2)*10,2);b.face=pc>cx?1:-1;
      if(b.st>(rage?1:1.6)){const o=['volley','swoop','breath'].filter(s=>s!==b.last),s=o[Math.random()*o.length|0];b.last=s;go(s)}break}
    case'volley':{b.face=pc>cx?1:-1;mv(b.x,oy+30,2);const n=rage?5:3,gap=rage?.22:.35;if(b.shots<n&&b.st>.4+b.shots*gap){b.shots++;bossFire(b)}if(b.st>.8+n*gap)go('hover');break}
    case'swoop':{if(b.st<.9){if(b.st<dt*2)b.dir0=cx<(ax+ar)/2?1:-1;mv(b.dir0>0?ax+4:ar-b.w-4,oy+14,4);b.face=b.dir0}
      else{const sp=rage?300:230,dist=ar-ax-b.w-8,pr=Math.min(1,(b.st-.9)*sp/dist);b.x=b.dir0>0?ax+4+pr*dist:ar-b.w-4-pr*dist;b.y=oy+14+Math.sin(pr*Math.PI)*(gy-oy-b.h-30);
        if(Math.random()<.5)parts.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:0,vy:20,life:.4,max:.4,col:'#ff8030',size:2,glow:true});if(pr>=1)go('hover')}break}
    case'breath':{if(b.st<1){if(b.st<dt*2)b.dir0=cx<(ax+ar)/2?1:-1;mv(b.dir0>0?ax+6:ar-b.w-6,gy-b.h,3);b.face=b.dir0}
      else if(b.st<2.6){b.mouth=.1;b.ft-=dt;if(b.ft<=0){b.ft=rage?.07:.1;projs.push({x:cx+b.face*36,y:b.y+b.h/2-14,vx:b.face*(200+Math.random()*50),vy:-20-Math.random()*90,g:220,r:4,life:3,col:'#ff8a2a',fire:true});if(Math.random()<.3)sfx(120,.1,'sawtooth',-40,.03)}}
      else go('hover');break}
    case'dying':b.y+=25*dt;shake=4;if(Math.random()<.6)burst(b.x+Math.random()*b.w,b.y+Math.random()*b.h,Math.random()<.5?'#ff8030':'#ffd060',6,140,2);
      if(b.st>2.6){burst(cx,b.y+b.h/2,'#ffd060',60,260,3);boss=null;L.bossDone=true;beaten[roomId]=1;sealDoors(false,d=>!d.eye);P.hp=P.maxHp;
        if(!grantSigil('emberheart'))say('THE WYRM IS SLAIN',3);saveGame()}return;}
  if(b.calm>0)b.calm-=dt;else if(ov(b,P))hurtPlayer(1,cx,false,true)}

function updProjs(dt){
  for(const q of projs){q.life-=dt;q.vy+=(q.g||0)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(tileAt(Math.floor(q.x/T),Math.floor(q.y/T))===1){q.life=0;burst(q.x,q.y,q.col,5,80,1)}
    else if(ov({x:q.x-q.r+1,y:q.y-q.r+1,w:q.r*2-2,h:q.r*2-2},P)){hurtPlayer(1,q.x,false,q.boss);q.life=0}
    if(q.fire&&Math.random()<.5)parts.push({x:q.x,y:q.y,vx:0,vy:-20,life:.25,max:.25,col:'#ffb040',size:2,glow:true})}
  projs=projs.filter(q=>q.life>0)}
function updCoins(dt){for(const c of coins){if(c.rest){if(Math.hypot(P.x+P.w/2-c.x,P.y+P.h/2-c.y)<(has('lure')?70:16))c.rest=false;continue}c.t+=dt;if(c.t<.4){c.vy+=600*dt;c.x+=c.vx*dt;c.y+=c.vy*dt}
    else{const dx=P.x+P.w/2-c.x,dy=P.y+P.h/2-c.y,d=Math.hypot(dx,dy)||1;c.x+=dx/d*300*dt;c.y+=dy/d*300*dt;if(d<8){c.got=true;rosaries++;if(c.lootId!==undefined)(lootTaken[roomId]=lootTaken[roomId]||[]).push(c.lootId);sfx(1400,.05,'square',300,.025)}}}
  coins=coins.filter(c=>!c.got)}

function adjust(id,dir){
  if(id==='diff')settings.diff=clamp(settings.diff+dir,0,DIFFS.length-1);
  else if(id==='volume'){settings.volume=clamp(settings.volume+dir,0,10);applyVolume()}
  else if(id==='music'){settings.music=clamp(settings.music+dir,0,10);applyVolume()}
  else if(id==='voices'){settings.voices=!settings.voices;if(!settings.voices)stopVoice()}
  else if(id==='narrator'){// cycle through this device's voices, best first, and say a line as a sample
    const names=['',...rankedVoices().map(v=>v.name)];settings.narrator=names[(names.indexOf(settings.narrator)+dir+names.length)%names.length];
    saveSettings();if(voiceList.length)speak('narrator','The map said the ruins of Kel Varran sat on solid granite.');return}
  else if(id==='shake')settings.shake=!settings.shake;
  else if(id==='touch'){const o=['auto','on','off'];settings.touch=o[(o.indexOf(settings.touch)+dir+3)%3];applyTouch()}
  else if(id==='minimap')settings.minimap=!settings.minimap;
  else if(id==='hires'){settings.hires=settings.hires===false;applyRes()}
  else if(id==='pads'){settings.pads=settings.pads==='edge'?'inward':'edge';applyTouch()}
  else return;
  saveSettings();sfx(660,.05,'square',0,.04)}
function startGame(fresh,cls){
  tutorial=null;

  const s=fresh?{}:migrateSave(saved);
  loadProgress(s);if(fresh){P.cls=cls||'knight';updateStats();P.hp=P.maxHp}state='play';paused=false;P.silk=0;playTime=s.playTime||0;din=0;

function activate(it){
  if(!it)return;

    case'continue':startGame(false);break;
    case'new':openMenu('diff','main');break;
    case'pick':settings.diff=it.i;saveSettings();openMenu('class','diff');break;
    case'class':openMenu('class','pause');break;
    case'cls':if(menu.back==='pause'){P.cls=it.k;updateStats();openMenu('pause');paused=false;say('YOU ARE NOW THE '+CLASSES[it.k].name,3);saveGame()}else startGame(true,it.k);sfx(330,.4,'triangle',330,.06);break;
    case'settings':openMenu('settings',menu.screen);break;
    case'back':openMenu(menu.back,menu.back==='pause'?'pause':'main');break;

function menuBack(){

function menuInput(){
  const items=menuItems(),n=items.length,horiz=menu.screen==='diff';
  const prev=horiz?pressed.left||pressed.up:pressed.up,next=horiz?pressed.right||pressed.down:pressed.down;
  if(prev||next){menu.sel=(menu.sel+(next?1:-1)+n)%n;sfx(440,.04,'square',0,.03)}
  const it=items[menu.sel];
  if(!horiz&&it&&(pressed.left||pressed.right))adjust(it.id,pressed.right?1:-1);
  if(pressed.jump||pressed.start||pressed.attack)activate(it);
  else if(pressed.pause||pressed.dash)menuBack()}
// mouse / touch: tap an item to select it; tap the left or right side of a setting to change it
function menuClick(e){
  if(scene){pressed.jump=true;return}// tap to advance a cutscene
  if(state!=='title'&&!paused&&!shop)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const hit=menuRects.find(m=>x>=m.x&&x<m.x+m.w&&y>=m.y&&y<m.y+m.h);
  if(!hit)return;
  if(shop){if(shop.sel===hit.i)pressed.jump=true;shop.sel=hit.i;return}
  menu.sel=hit.i;const it=menuItems()[hit.i];
  if(it.val!==undefined)adjust(it.id,x<hit.x+hit.w*.6?-1:1);else activate(it)}

/* ---------- main update ---------- */
function update(dt){
  time+=dt;if(pressed.mute){muted=!muted;applyVolume();if(muted)stopVoice();pressed.mute=false}
  if(scene){updScene(dt);return}
  if(state==='title'){const regs=Object.values(REGIONS);BIO=regs[Math.floor(time/6)%regs.length];cam.x=time*25;cam.y=0;ambient();updParts(dt);menuInput();return}
  if(state==='win'){winT+=dt;ambient();updParts(dt);if(winT>2&&(pressed.start||pressed.jump)){state='title';loadProgress({});openMenu('main')}return}
  if(paused){menuInput();return}
  if(shop){shopInput();return}
  if(gear){gearInput();return}
  if(pressed.gear&&state==='play'){openGear();return}
  if(pressed.pause&&state!=='win'){paused=true;pressed.pause=false;openMenu('pause');return}
  // hold presses through hitstop so a jump or attack in the freeze still happens
  if(hitstop>0){hitstop-=dt;return 'hold'}
  card-=dt;msgT-=dt;bossCard-=dt;fadeIn-=dt;shake=Math.max(0,shake-dt*25);kick.x=approach(kick.x,0,dt*50);kick.y=approach(kick.y,0,dt*50);
  if(state==='dead'){deadT-=dt;updParts(dt);if(deadT<=0){P.hp=P.maxHp;P.silk=0;P.oil=Math.max(P.oil,30);din=0;state='play';enterRoom(cp.room,{benchX:cp.x})}return}
  playTime+=dt;
  updPlayer(dt);if(state!=='play')return;
  if(tutorial)updTutorial(dt);
  updRiding(dt);
  if(BIO.storm){stormT-=dt;if(stormT<=0){stormT=4+Math.random()*6;flashT=.3;noise(1.4,380,45,.5,'lowpass');shake=Math.max(shake,2)}}// lightning in the Stormwell
  updEnemies(dt);
  const firstNew=projs.length;
  if(boss)(boss.G?updGuard:boss.kind==='listener'?updListenerBoss:updBoss)(dt);
  for(let i=firstNew;i<projs.length;i++)projs[i].boss=true;// boss shots use the boss damage of the difficulty
  if(boss&&boss.burn>0&&boss.hp>0&&boss.state!=='dying'){boss.burn-=dt;boss.btick-=dt;
    if(Math.random()<.6)parts.push({x:boss.x+Math.random()*boss.w,y:boss.y+Math.random()*boss.h*.6,vx:0,vy:-50,life:.35,max:.35,col:Math.random()<.5?'#ffd060':'#ff6a20',size:2,glow:true});
    if(boss.btick<=0){boss.btick=.8;boss.hp--;boss.hurt=.06;if(boss.hp<=0)bossDown()}}
 updProjs(dt);updCoins(dt);updObjects(dt);if(lis)updListener(dt);updShots(dt);updCrumble(dt);updSurvival(dt);ambient();updParts(dt);
  cam.x+=(clamp(P.x+P.w/2-W/2+P.face*30,0,L.w*T-W)-cam.x)*Math.min(1,dt*6);
  cam.y+=(clamp(P.y+P.h/2-H*.55,0,L.h*T-H)-cam.y)*Math.min(1,dt*5);
}
